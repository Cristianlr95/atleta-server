# Test configuration using H2 in-memory database
# This provides fast, isolated testing without external dependencies

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE ALIAS IF NOT EXISTS GEN_RANDOM_UUID FOR "java.util.UUID.randomUUID";DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration for H2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway Configuration for H2
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# Logging - reduced for test performance
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.com.atleta.demo=INFO
logging.level.org.hibernate.SQL=WARN
