spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?ssl=true&sslmode=require&sslcert=${SSL_CERT_PATH:}&sslkey=${SSL_KEY_PATH:}&sslrootcert=${SSL_ROOT_CERT_PATH:}&sslpassword=${SSL_PASSWORD:}&connectTimeout=30&socketTimeout=60&tcpKeepAlive=true&ApplicationName=Atleta-Production
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      idle-timeout: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      pool-name: HikariPool-Atleta-Production
      register-mbeans: true
      data-source-properties:
        ssl: true
        sslmode: require
        sslcert: ${SSL_CERT_PATH:}
        sslkey: ${SSL_KEY_PATH:}
        sslrootcert: ${SSL_ROOT_CERT_PATH:}
        sslpassword: ${SSL_PASSWORD:}
        connectTimeout: 30000
        socketTimeout: 60000
        tcpKeepAlive: true
        ApplicationName: Atleta-Production

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[show_sql]": false
        "[format_sql]": false
        jdbc:
          lob:
            "[non_contextual_creation]": true
          "[batch_size]": 25
        "[order_inserts]": true
        "[order_updates]": true
        query:
          timeout: 60000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: true
    schemas: public
    table: flyway_schema_history
    connect-retries: 3

security:
  jwt:
    issuer: ${JWT_ISSUER:atleta-prod}
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}

logging:
  level:
    "[com.atleta.demo]": ERROR
    "[org.springframework.security]": ERROR
    "[org.springframework.web]": ERROR
    "[org.hibernate.SQL]": ERROR
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": ERROR
    "[org.flywaydb]": ERROR
    "[com.zaxxer.hikari]": ERROR
    "[org.springframework.jdbc.core.JdbcTemplate]": ERROR
    "[org.springframework.dao]": ERROR
    "[org.springframework.transaction]": ERROR
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 500MB
    max-history: 60
  logback:
    rollingpolicy:
      max-file-size: 500MB
      max-history: 60

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    db:
      enabled: true

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
