spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:staging-db.atleta.com}:${DB_PORT:5432}/${DB_NAME:atleta_staging}
    username: ${DB_USERNAME:atleta_staging}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[show_sql]": false
        "[format_sql]": false
        jdbc:
          lob:
            "[non_contextual_creation]": true
        query:
          timeout: 60000
          
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true  # Seguridad: no permitir clean
    schemas: public
    table: flyway_schema_history
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://staging-auth.atleta.com/oauth2/jwks}

logging:
  level:
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": WARN
    "[org.flywaydb]": INFO
    "[com.atleta.demo]": INFO
    "[com.zaxxer.hikari]": INFO
    "[org.springframework.jdbc.core.JdbcTemplate]": INFO
    "[org.springframework.security]": WARN
    "[org.springframework.web]": WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"
  file:
    name: logs/staging-application.log
    max-size: 100MB
    max-history: 30

# Configuración específica de Actuator para staging
management:
  endpoint:
    health:
      show-details: when-authorized  # Mostrar detalles solo a usuarios autorizados
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${SERVER_PORT:8080}