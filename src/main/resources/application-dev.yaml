spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atleta_dev}?ApplicationName=Atleta-Dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[show_sql]": true
        "[format_sql]": true
        "[use_sql_comments]": true
        jdbc:
          lob:
            "[non_contextual_creation]": true
        query:
          timeout: 30000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
    schemas: public
    table: flyway_schema_history

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

security:
  jwt:
    issuer: ${JWT_ISSUER:atleta-dev}
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}

logging:
  level:
    "[com.atleta.demo]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.web]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.hibernate.type.descriptor.sql.BasicExtractor]": TRACE
    "[org.hibernate.engine.jdbc.batch.internal.BatchingBatch]": DEBUG
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": DEBUG
    "[org.flywaydb]": DEBUG
    "[com.zaxxer.hikari]": DEBUG
    "[org.springframework.jdbc.core.JdbcTemplate]": DEBUG
    "[org.springframework.jdbc.core.StatementCreatorUtils]": TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  dev-seed:
    # Solo se evalua con el perfil dev; nunca se carga en staging o produccion.
    enabled: ${DEV_SEED_ENABLED:true}
    password: ${DEV_SEED_PASSWORD:AtletaDev!2026}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8100,http://localhost:4200,http://localhost:4201,http://localhost:3000}
