spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/atleta_dev
    username: postgres
    password: '12345'  # Reemplaza con la contraseña real
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Solo validar, Flyway maneja el esquema
    properties:
      hibernate:
        "[show_sql]": true
        "[format_sql]": true
        "[use_sql_comments]": true
        jdbc:
          lob:
            "[non_contextual_creation]": true
        query:
          timeout: 30000
          
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false  # Permitir clean en desarrollo
    schemas: public
    table: flyway_schema_history
  
  #security:
  #  oauth2:
  #    resourceserver:
  #      jwt:
  #        issuer-uri: http://localhost:8080/oauth2/jwks
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

logging:
  level:
    "[com.atleta.demo]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.web]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.hibernate.type.descriptor.sql.BasicExtractor]": TRACE
    "[org.hibernate.engine.jdbc.batch.internal.BatchingBatch]": DEBUG
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": DEBUG
    "[org.flywaydb]": DEBUG
    "[com.zaxxer.hikari]": DEBUG
    "[org.springframework.jdbc.core.JdbcTemplate]": DEBUG
    "[org.springframework.jdbc.core.StatementCreatorUtils]": TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"

# Configuración específica de Actuator para desarrollo
management:
  endpoint:
    health:
      show-details: always  # Mostrar todos los detalles en desarrollo
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8080