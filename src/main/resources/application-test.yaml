spring:
  datasource:
    # H2 configuration for testing when Docker is not available
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[show_sql]": false
        "[format_sql]": false
        jdbc:
          lob:
            "[non_contextual_creation]": true
            
  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/test-data
    clean-disabled: false
    baseline-on-migrate: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/oauth2/jwks

logging:
  level:
    "[com.atleta.demo]": WARN
    "[org.springframework.security]": WARN
    "[org.springframework.web]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": WARN
    "[org.springframework.boot.test]": DEBUG
    "[org.flywaydb]": WARN
    "[org.testcontainers]": INFO
    "[com.zaxxer.hikari]": WARN
    "[org.springframework.jdbc.core.JdbcTemplate]": WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"

# Configuración específica de Actuator para testing
management:
  endpoint:
    health:
      show-details: never  # Ocultar detalles en testing
  prometheus:
    metrics:
      export:
        enabled: false  # Deshabilitar Prometheus en tests

server:
  port: 0  # Random port for tests