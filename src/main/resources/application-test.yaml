spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[show_sql]": false
        "[format_sql]": false
        jdbc:
          lob:
            "[non_contextual_creation]": true

  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/test-data
    clean-disabled: false
    baseline-on-migrate: true

security:
  jwt:
    issuer: ${JWT_ISSUER:atleta-test}
    secret: ${JWT_SECRET:VGhpc0lzQVRlc3RTZWNyZXRGb3JBdGxldGFKV1RfMjAyNg==}
    expiration: ${JWT_EXPIRATION:PT1H}

logging:
  level:
    "[com.atleta.demo]": WARN
    "[org.springframework.security]": WARN
    "[org.springframework.web]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": WARN
    "[org.springframework.boot.test]": DEBUG
    "[org.flywaydb]": WARN
    "[org.testcontainers]": INFO
    "[com.zaxxer.hikari]": WARN
    "[org.springframework.jdbc.core.JdbcTemplate]": WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] [%X{transactionId}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: false

atleta:
  matches:
    scheduler:
      enabled: false

server:
  port: 0
