# Docker Compose para CI/CD local
# Uso: docker-compose -f docker-compose.ci.yml up

version: '3.8'

services:
  postgres-ci:
    image: postgres:16
    environment:
      POSTGRES_DB: atleta_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_ci_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d atleta_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  atleta-app:
    build: .
    depends_on:
      postgres-ci:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: postgres-ci
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: atleta_test
    ports:
      - "8080:8080"
    command: ["java", "-jar", "/app/server-atleta.jar"]

volumes:
  postgres_ci_data: