name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Entorno a desplegar cuando exista proveedor real"
        required: false
        type: choice
        options:
          - none
          - staging
          - production
        default: none

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Xmx1024m"

jobs:
  test:
    name: Tests y Validacion
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atleta_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d atleta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Dar permisos de ejecucion
        run: chmod +x mvnw scripts/*.sh || true

      - name: Ejecutar tests unitarios
        run: ./mvnw test -Dspring.profiles.active=test

      - name: Ejecutar tests de integracion
        run: ./mvnw test -Dtest="*IntegrationTest" -Dspring.profiles.active=test

      - name: Ejecutar tests de migracion
        run: ./mvnw test -Dtest="*MigrationTest,FlywayIntegrationTest" -Dspring.profiles.active=test

      - name: Validar migraciones Flyway
        run: ./mvnw -Dflyway.url=jdbc:postgresql://localhost:5432/atleta_test -Dflyway.user=test -Dflyway.password=test -Dflyway.locations=classpath:db/migration flyway:migrate flyway:validate

      - name: Generar reporte de cobertura
        run: ./mvnw jacoco:report

  build:
    name: Build y Empaquetado
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Dar permisos de ejecucion
        run: chmod +x mvnw scripts/*.sh || true

      - name: Compilar aplicacion
        run: ./mvnw clean compile

      - name: Empaquetar aplicacion
        run: ./mvnw package -DskipTests

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: atleta-server-jar
          path: target/*.jar

  deploy-staging:
    name: Deploy a Staging (manual disabled)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging' && vars.ATLETA_ENABLE_REAL_DEPLOY == 'true'
    environment: staging

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: atleta-server-jar
          path: target/

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Dar permisos de ejecucion
        run: chmod +x mvnw scripts/*.sh || true

      - name: Validar migraciones en staging
        run: ./mvnw -Dflyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME} -Dflyway.user=${DB_USERNAME} -Dflyway.password=${DB_PASSWORD} -Dflyway.locations=classpath:db/migration flyway:info flyway:validate
        env:
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}

      - name: Ejecutar migraciones en staging
        run: ./mvnw -Dflyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME} -Dflyway.user=${DB_USERNAME} -Dflyway.password=${DB_PASSWORD} -Dflyway.locations=classpath:db/migration flyway:migrate
        env:
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}

      - name: Backup antes del deploy
        run: ./scripts/backup-database.sh staging
        env:
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}

      - name: Deploy a staging
        run: echo "Deploy to staging server"

  deploy-production:
    name: Deploy a Produccion (manual disabled)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production' && vars.ATLETA_ENABLE_REAL_DEPLOY == 'true'
    environment: production

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: atleta-server-jar
          path: target/

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Dar permisos de ejecucion
        run: chmod +x mvnw scripts/*.sh || true

      - name: Validar migraciones en produccion
        run: ./mvnw -Dflyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?ssl=true\&sslmode=require -Dflyway.user=${DB_USERNAME} -Dflyway.password=${DB_PASSWORD} -Dflyway.locations=classpath:db/migration flyway:info flyway:validate
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}

      - name: Backup completo antes del deploy
        run: ./scripts/backup-database.sh prod
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}

      - name: Ejecutar migraciones en produccion
        run: ./mvnw -Dflyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?ssl=true\&sslmode=require -Dflyway.user=${DB_USERNAME} -Dflyway.password=${DB_PASSWORD} -Dflyway.locations=classpath:db/migration flyway:migrate
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}

      - name: Deploy a produccion
        run: echo "Deploy to production server"

      - name: Verificar health check post-deploy
        run: |
          sleep 30
          curl -f http://your-prod-server/actuator/health || exit 1
