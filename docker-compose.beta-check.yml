# Disposable verification stack. No connection to Neon or local development data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atleta_beta_check
      POSTGRES_USER: beta
      POSTGRES_PASSWORD: local-beta-check-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U beta -d atleta_beta_check"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  backend:
    build: .
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.1
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: beta
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/atleta_beta_check
      DB_USERNAME: beta
      DB_PASSWORD: local-beta-check-only
      JWT_SECRET: local-beta-check-secret-32-bytes-minimum-abcdefghijk
      FRONTEND_URL: https://atleta-beta.pages.dev
      BETA_INVITE_CODE: local-beta-invitation-test-only
      JAVA_OPTS: -Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -Xss512k -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
